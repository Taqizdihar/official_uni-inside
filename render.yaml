services:
  - type: web
    name: uni-inside-cms-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: API_BASE_PATH
        value: /api/v1
      - key: APP_NAME
        value: Uni-Inside CMS API
      - key: SESSION_COOKIE_SECURE
        value: 'true'
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: 'true'
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: required
      - key: DB_SSL_CA_BASE64
        sync: false
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: 'true'
      - key: REQUIRE_LATEST_MIGRATION
        value: 'true'
      - key: SECONDARY_CONTENT_SLOTS_ENABLED
        value: 'true'
      - key: SOCIAL_MEDIA_V2_ENABLED
        value: 'true'
      - key: PRODUCT_VARIANT_MEDIA_ENABLED
        value: 'true'
      - key: HERO_THREE_LINE_ENABLED
        value: 'true'
      - key: ABOUT_EDITORIAL_V2_ENABLED
        value: 'true'
      - key: HOMEPAGE_NEWS_SELECTION_ENABLED
        value: 'true'
      - key: CONTACT_PLACEMENTS_ENABLED
        value: 'true'
      - key: FOOTER_V2_ENABLED
        value: 'true'
      - key: TEAM_TEMPLATE_ENABLED
        value: 'true'
      - key: AUTH_TOKEN_PEPPER
        sync: false
      - key: ANALYTICS_HASH_PEPPER
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: DB_CONNECTION_LIMIT
        value: '5'
      - key: SESSION_COOKIE_NAME
        value: uniinside_session
      - key: SESSION_TTL_HOURS
        value: '12'
      - key: SESSION_IDLE_TTL_MINUTES
        value: '60'
      - key: CSRF_COOKIE_NAME
        value: uniinside_csrf
      - key: PASSWORD_MIN_LENGTH
        value: '12'
      - key: LOGIN_RATE_LIMIT_WINDOW_MINUTES
        value: '15'
      - key: LOGIN_RATE_LIMIT_MAX
        value: '8'
      - key: API_RATE_LIMIT_WINDOW_MINUTES
        value: '15'
      - key: API_RATE_LIMIT_MAX
        value: '300'
      - key: ANALYTICS_RETENTION_DAYS
        value: '90'
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_ROOT_FOLDER
        value: uni-inside
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_NAME
        value: Uni-Inside Studio
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: LOG_LEVEL
        value: info
