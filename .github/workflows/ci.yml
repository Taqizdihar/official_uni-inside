name: CI

on:
  push:
    branches: [hosting, main]
  pull_request:
    branches: [hosting, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:config
      - run: npm run build
        env:
          # Simulate the Kroombox Fullstack gateway variable overriding .env.production.
          VITE_API_BASE_URL: /api/v1
      - name: Verify production bundle targets Render
        run: |
          if ! grep -R -q -F 'https://uni-inside-studio-landing-page.onrender.com/api/v1' dist/assets; then
            echo 'Production frontend bundle is missing the Render API override' >&2
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run openapi:check
      - run: npm run build
