openapi: 3.1.0
info:
  title: Uni-Inside CMS API
  version: 1.0.0
  description: Authenticated CMS and public content API for Uni-Inside.
servers:
  - url: http://localhost:4000/api/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: uniinside_session
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token returned by login or current-session lookup; must also match the CSRF cookie.
      schema: { type: string }
    Resource:
      name: resource
      in: path
      required: true
      description: An explicitly configured CMS resource; fixed resources support only GET and PATCH.
      schema:
        type: string
        enum: [social-links, partners, team-members, product-categories, products, product-images, product-features, product-color-options, product-variants, product-purchase-links, service-categories, services, service-list-items, service-process-steps, service-images, projects, project-images, news-categories, news, news-images, achievements, contact-chat-messages, site-settings, page-settings, homepage-sections, hero-settings, hero-trust-signals, hero-workspaces, hero-hotspots, about-settings, about-workspaces, about-principles, team-section-settings, achievement-section-settings, contact-section-settings]
    Key:
      name: key
      in: path
      required: true
      schema: { type: string }
  schemas:
    SecondaryPageSave:
      anyOf:
        - title: Products
          type: object
          additionalProperties: false
          required:
            - edit
            - expectedVersion
          properties:
            expectedVersion:
              type: string
              pattern: ^[a-f0-9]{64}$
            edit:
              type: object
              additionalProperties: false
              required:
                - heading
                - description
                - cta_label
                - cta_url
              properties:
                heading:
                  type: string
                  maxLength: 30
                  minLength: 1
                description:
                  type: string
                  maxLength: 220
                  minLength: 1
                cta_label:
                  type: string
                  maxLength: 25
                  minLength: 1
                cta_url:
                  type: string
                  maxLength: 1000
                  minLength: 1
        - title: Services
          type: object
          additionalProperties: false
          required:
            - edit
            - expectedVersion
          properties:
            expectedVersion:
              type: string
              pattern: ^[a-f0-9]{64}$
            edit:
              type: object
              additionalProperties: false
              required:
                - heading
                - description
                - cta_label
                - cta_url
              properties:
                heading:
                  type: string
                  maxLength: 30
                  minLength: 1
                description:
                  type: string
                  maxLength: 220
                  minLength: 1
                cta_label:
                  type: string
                  maxLength: 25
                  minLength: 1
                cta_url:
                  type: string
                  maxLength: 1000
                  minLength: 1
        - title: News
          type: object
          additionalProperties: false
          required:
            - edit
            - expectedVersion
          properties:
            expectedVersion:
              type: string
              pattern: ^[a-f0-9]{64}$
            edit:
              type: object
              additionalProperties: false
              required:
                - heading
                - description
              properties:
                heading:
                  type: string
                  maxLength: 45
                  minLength: 1
                description:
                  type: string
                  maxLength: 120
                  minLength: 1
        - title: Media Kit
          type: object
          additionalProperties: false
          required:
            - edit
            - expectedVersion
          properties:
            expectedVersion:
              type: string
              pattern: ^[a-f0-9]{64}$
            edit:
              type: object
              additionalProperties: false
              required:
                - description
              properties:
                description:
                  type: string
                  maxLength: 220
                  minLength: 1
        - title: Projects
          type: object
          additionalProperties: false
          required:
            - edit
            - expectedVersion
          properties:
            expectedVersion:
              type: string
              pattern: ^[a-f0-9]{64}$
            edit:
              type: object
              additionalProperties: false
              required:
                - heading
                - description
              properties:
                heading:
                  type: string
                  maxLength: 25
                  minLength: 1
                description:
                  type: string
                  maxLength: 160
      description: >-
        Select the variant for the page path. Unchanged over-limit historical text is preserved by
        server validation.
    AboutSupportedEdit:
      type: object
      additionalProperties: false
      required: [intro, ecosystem, guides, partnersHeading]
      description: Only supported existing-schema fields. Unchanged legacy values above a new visual limit are preserved; pending editorial properties are rejected.
      properties:
        intro:
          type: object
          additionalProperties: false
          required: [subtitle, description]
          properties:
            subtitle: { type: string, minLength: 1, maxLength: 50 }
            description: { type: string, minLength: 1, maxLength: 170 }
        ecosystem:
          type: object
          additionalProperties: false
          required: [heading, workspaces]
          properties:
            heading: { type: string, minLength: 1, maxLength: 40 }
            workspaces:
              type: array
              minItems: 2
              maxItems: 2
              description: Studio then Craft, with fixed identities.
              items:
                type: object
                additionalProperties: false
                required: [key, subtitle, description]
                properties:
                  key: { type: string, enum: [studio, craft] }
                  subtitle: { type: string, minLength: 1, maxLength: 30 }
                  description: { type: string, minLength: 1, maxLength: 180 }
        guides:
          type: object
          additionalProperties: false
          required: [heading, principles]
          properties:
            heading: { type: string, minLength: 1, maxLength: 20 }
            principles:
              type: array
              minItems: 3
              maxItems: 3
              description: Fixed slots 1, 2, and 3 in that order.
              items:
                type: object
                additionalProperties: false
                required: [slot, heading, description]
                properties:
                  slot: { type: integer, minimum: 1, maximum: 3 }
                  heading: { type: string, minLength: 1, maxLength: 30 }
                  description: { type: string, minLength: 1, maxLength: 110 }
        partnersHeading: { type: string, minLength: 1, maxLength: 30 }
    AboutSaveInput:
      type: object
      additionalProperties: false
      required: [edit, expectedVersion]
      properties:
        edit: { $ref: '#/components/schemas/AboutSupportedEdit' }
        expectedVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
    TeamHeadingSaveInput:
      type: object
      additionalProperties: false
      required: [edit, expectedVersion]
      properties:
        edit:
          type: object
          additionalProperties: false
          required: [heading]
          properties:
            heading: { type: string, minLength: 1, maxLength: 15 }
        expectedVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
    HomepageTeamMemberInput:
      type: object
      additionalProperties: false
      required: [full_name, role_title, short_bio, photo_media_id, status]
      description: Website member card, independent of CMS users. Profile URLs are optional individual HTTPS profiles on the matching official platform. Images must be supported raster formats in Halaman Utama. A non-1080x1350 image produces a dimension warning.
      properties:
        full_name: { type: string, minLength: 1, maxLength: 150 }
        role_title: { type: string, minLength: 1, maxLength: 190 }
        short_bio: { type: string, minLength: 1, maxLength: 1000 }
        photo_media_id: { type: integer, minimum: 1 }
        linkedin_url: { type: [string, 'null'], maxLength: 1000 }
        instagram_url: { type: [string, 'null'], maxLength: 1000 }
        x_url: { type: [string, 'null'], maxLength: 1000 }
        github_url: { type: [string, 'null'], maxLength: 1000 }
        status: { type: string, enum: [draft, published, archived] }
    HomepagePartnerInput:
      type: object
      additionalProperties: false
      required: [name, logo_media_id, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        logo_media_id: { type: integer, minimum: 1 }
        website_url: { type: [string, 'null'], maxLength: 1000, description: Optional safe HTTP(S) URL; null produces a non-clickable logo. }
        status: { type: string, enum: [draft, published, archived] }
    HeroEditInput:
      type: object
      additionalProperties: false
      required: [headingLine1, headingLine2, descriptionLine1, descriptionLine2, trustSignals, workspaces, callouts]
      description: 'One fixed Hero form. headingLine1 has the fixed Ideas prefix plus at most nine editable Unicode code points, including spaces. headingLine3 is accepted only when HERO_THREE_LINE_ENABLED, the column exists, and the reviewed prefix/third-line backfill is present. Unchanged legacy text may exceed a new visual limit.'
      properties:
        headingLine1: { type: string, maxLength: 14, pattern: '^Ideas' }
        headingLine2: { type: string, maxLength: 18 }
        headingLine3: { type: string, maxLength: 18 }
        descriptionLine1: { type: string, maxLength: 50 }
        descriptionLine2: { type: [string, 'null'], maxLength: 50 }
        trustSignals:
          type: array
          minItems: 3
          maxItems: 3
          description: 'Slots 1, 2, 3 in that order.'
          items:
            type: object
            additionalProperties: false
            required: [slot, numericValue, suffix, label]
            properties:
              slot: { type: integer, minimum: 1, maximum: 3 }
              numericValue: { type: integer, minimum: 0, maximum: 9999999 }
              suffix: { type: [string, 'null'], maxLength: 16 }
              label: { type: string, maxLength: 14 }
        workspaces:
          type: array
          minItems: 2
          maxItems: 2
          description: 'Studio then Craft; each CTA URL is an internal / path or credential-free HTTPS URL.'
          items:
            type: object
            additionalProperties: false
            required: [key, primaryLabel, primaryUrl, secondaryLabel, secondaryUrl]
            properties:
              key: { type: string, enum: [studio, craft] }
              primaryLabel: { type: string, maxLength: 25 }
              primaryUrl: { type: string, maxLength: 1000 }
              secondaryLabel: { type: [string, 'null'], maxLength: 25 }
              secondaryUrl: { type: [string, 'null'], maxLength: 1000 }
        callouts:
          type: array
          minItems: 10
          maxItems: 10
          description: 'The ten predefined hotspot keys, in display order. Each label is the complete visible line, including a numeric prefix such as 50+ when present; edits are mapped to the existing numeric and label columns.'
          items:
            type: object
            additionalProperties: false
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string, maxLength: 30 }
    FooterSettingsInput:
      type: object
      additionalProperties: false
      required: [footer_description, public_email, public_phone, address_text]
      properties:
        footer_description: { type: [string, 'null'], maxLength: 1000 }
        public_email: { type: [string, 'null'], format: email, maxLength: 254 }
        public_phone: { type: [string, 'null'], maxLength: 50, pattern: '^[+0-9().\\s-]+$' }
        address_text: { type: [string, 'null'], maxLength: 500 }
    FooterSocialPlacement:
      type: object
      description: Guarded V2 placement contract, active only after the schema and feature flag are verified.
      additionalProperties: false
      required: [social_link_id, position]
      properties:
        social_link_id: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 1, maximum: 10 }
    FooterV2Input:
      type: object
      additionalProperties: false
      required: [footer_description, public_email, public_phone, address_text, socialLinkIds, google_maps_embed_url, expectedVersion]
      properties:
        footer_description: { type: [string, 'null'], maxLength: 1000 }
        public_email: { type: [string, 'null'], format: email, maxLength: 254 }
        public_phone: { type: [string, 'null'], maxLength: 50 }
        address_text: { type: [string, 'null'], maxLength: 500 }
        socialLinkIds: { type: array, maxItems: 10, uniqueItems: true, items: { type: integer, minimum: 1 } }
        google_maps_embed_url: { type: string, maxLength: 1000 }
        expectedVersion: { type: string, pattern: '^[a-f0-9]{64}$' }
    FooterMapsEmbed:
      type: string
      format: uri
      maxLength: 2048
      description: Future contract only. HTTPS official Google Maps Embed URLs; no live storage or save route exists yet.
    ProductCompose:
      type: object
      additionalProperties: false
      required: [action, name]
      properties:
        action: { type: string, enum: [draft, publish] }
        name: { type: string, minLength: 1, maxLength: 190 }
        category_id: { type: [integer, 'null'], minimum: 1 }
        product_type: { type: string, enum: [ready_made, custom, both] }
        description: { type: string, maxLength: 70000 }
        cover_media_id: { type: [integer, 'null'], minimum: 1 }
        gallery_media_ids: { type: array, maxItems: 8, uniqueItems: true, items: { type: integer, minimum: 1 } }
        base_price: { type: [number, 'null'], minimum: 0, maximum: 999999999999 }
        currency_code: { type: string, pattern: '^[A-Z]{3}$', default: IDR }
        availability_label: { type: [string, 'null'], maxLength: 100 }
        price_note: { type: [string, 'null'], maxLength: 255 }
        lead_time_text: { type: [string, 'null'], maxLength: 255 }
        minimum_order_quantity: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }
        features:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [label, value_text]
            properties:
              label: { type: string, minLength: 1, maxLength: 150 }
              value_text: { type: string, minLength: 1, maxLength: 500 }
        variants:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [name, price, stock_quantity, is_active]
            properties:
              name: { type: string, minLength: 1, maxLength: 150 }
              price: { type: number, minimum: 0, maximum: 999999999999, description: 'Final price; stored as an adjustment relative to base_price' }
              stock_quantity: { type: [integer, 'null'], minimum: 0, maximum: 2147483647 }
              is_active: { type: boolean }
              media_id: { type: [integer, 'null'], minimum: 1, description: 'Only accepted when PRODUCT_VARIANT_MEDIA_ENABLED=true and the required schema is present; otherwise non-null is rejected' }
        platforms:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [platform]
            properties:
              platform: { type: string, enum: [shopee, tokopedia, tiktok, shopify, whatsapp] }
              url: { type: string, maxLength: 1000, description: 'Required HTTP(S) product URL for the four marketplaces; forbidden for WhatsApp' }
              social_link_id: { type: integer, minimum: 1, description: 'Required for WhatsApp only when Social Media V2 is enabled and ready; forbidden otherwise' }
    SocialAccountInput:
      type: object
      additionalProperties: false
      required: [platform_code, label_suffix, url]
      properties:
        platform_code: { type: string, enum: [instagram, whatsapp, youtube, linkedin, tiktok, facebook, x, github, pinterest, threads, discord, telegram] }
        label_suffix: { type: string, minLength: 1, maxLength: 100, description: 'Combined with the immutable platform prefix and " - "; full label max 100 characters' }
        description: { type: [string, 'null'], maxLength: 1000 }
        url: { type: string, format: uri, maxLength: 1000, description: 'Direct HTTPS account URL on the selected platform domain' }
        is_active: { type: boolean, default: true }
        sort_order: { type: integer, minimum: 0, maximum: 65535, default: 0 }
    SocialAccountPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label_suffix: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        url: { type: string, format: uri, maxLength: 1000 }
        is_active: { type: boolean }
        sort_order: { type: integer, minimum: 0, maximum: 65535 }
    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta: { type: object }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: {} }
            requestId: { type: string }
    Login:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 1024 }
    Event:
      type: object
      additionalProperties: false
      required: [eventUuid, eventName]
      properties:
        eventUuid: { type: string, format: uuid }
        eventName: { type: string, enum: [page_view, product_view, product_purchase_link_click, service_view, news_view, cta_click] }
        pagePath: { type: string, maxLength: 500 }
        entityType: { type: string, enum: [product, service, news] }
        entityId: { type: integer, minimum: 1 }
        linkDestination: { type: string, format: uri }
        referrerHost: { type: string, maxLength: 255 }
    ServiceCreateInput:
      type: object
      additionalProperties: false
      required: [name, category_id, description, cover_media_id, gallery_media_ids, pricing_type, starting_price, currency_code, price_note, estimated_duration, items, process_steps, primary_cta_label, primary_cta_url, status]
      properties:
        name: { type: string, maxLength: 190 }
        category_id: { type: [integer, 'null'] }
        description: { type: string, maxLength: 100000, description: Restricted rich text HTML }
        cover_media_id: { type: [integer, 'null'] }
        gallery_media_ids: { type: array, maxItems: 8, items: { type: integer } }
        pricing_type: { type: string, enum: [contact, fixed, starting_from, range] }
        starting_price: { type: [number, 'null'], minimum: 0 }
        currency_code: { type: string, enum: [IDR, USD, SGD, EUR, AUD, MYR] }
        price_note: { type: string, maxLength: 255 }
        estimated_duration: { type: string, maxLength: 255 }
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [item_type, label]
            properties:
              item_type: { type: string, enum: [deliverable, included, requirement, not_included] }
              label: { type: string, maxLength: 500 }
        process_steps:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [title, description]
            properties:
              title: { type: string, maxLength: 150 }
              description: { type: string, maxLength: 1000 }
        primary_cta_label: { type: string, maxLength: 100 }
        primary_cta_url: { type: string, maxLength: 1000 }
        status: { type: string, enum: [draft, published] }
    NewsCreateInput:
      type: object
      additionalProperties: false
      required: [action, title, content_type, category_id, excerpt, body, cover_media_id, gallery_media_ids, author, reading_time_minutes]
      properties:
        action: { type: string, enum: [draft, publish] }
        title: { type: string, maxLength: 255 }
        content_type: { type: string, enum: [news, article, update, event] }
        category_id: { type: [integer, 'null'] }
        excerpt: { type: string, maxLength: 1000 }
        body: { type: string, maxLength: 80000, description: Restricted editorial HTML }
        cover_media_id: { type: [integer, 'null'] }
        gallery_media_ids: { type: array, maxItems: 100, items: { type: integer, minimum: 1 } }
        author:
          oneOf:
            - { type: 'null' }
            - { type: object, additionalProperties: false, required: [source, id], properties: { source: { type: string, enum: [user, team] }, id: { type: integer, minimum: 1 } } }
        reading_time_minutes: { type: [integer, 'null'], minimum: 1, maximum: 999, description: 'Null calculates from readable body text at 200 words per minute' }
    ContentInput:
      type: object
      minProperties: 1
      description: Resource-specific, strict writable fields. Unknown fields are rejected. See backend/src/schemas/resources.ts for each explicit Zod schema; status transitions also run publish validation.
paths:
  /admin/secondary-pages/{page}:
    parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
          enum:
            - products
            - services
            - news
            - media-kit
            - projects
    get:
      summary: Read one fixed secondary-page editor
      description: >-
        Requires settings.view. Returns supported edit, version, read-only pending defaults and false
        slot/banner capabilities. Projects is disabled by default without querying its missing
        singleton.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Supported content or disabled Projects preparation
        '403':
          description: Missing permission
        '503':
          description: Missing page settings
    patch:
      summary: Save supported secondary fields atomically
      description: >-
        Requires settings.update and CSRF. Rejects pending/restricted properties; preserves hidden
        SEO, artwork and fixed structure. Projects requires explicit activation and an existing
        singleton.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondaryPageSave'
      responses:
        '200':
          description: Actual persisted supported values
        '400':
          description: Invalid or restricted fields
        '403':
          description: Missing permission, CSRF or disabled Projects
        '409':
          description: Stale version
        '503':
          description: Missing singleton
  /health:
    get:
      summary: Process liveness without database access
      responses: { '200': { description: Live, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } } }
  /ready:
    get:
      summary: Database and schema readiness
      responses:
        '200': { description: Ready }
        '503': { description: Database or migration unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /site:
    get:
      summary: Public site settings, social links, and page settings
      responses: { '200': { description: Published settings } }
  /homepage:
    get:
      summary: Bounded public homepage aggregate
      responses: { '200': { description: Homepage data } }
  /team-members:
    get:
      summary: Published team members
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Team members } }
  /partners:
    get:
      summary: Published partners
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Partners } }
  /products:
    get:
      summary: Published products
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Products } }
  /products/{slug}:
    get:
      summary: Published product with images and child records
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Product }, '404': { description: Not published or not found } }
  /services:
    get:
      summary: Published services
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Services } }
  /services/{slug}:
    get:
      summary: Published service with images, items, and process steps
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Service }, '404': { description: Not published or not found } }
  /projects:
    get:
      summary: Published projects
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Projects } }
  /projects/{slug}:
    get:
      summary: Published project with related services, images and people
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Project }, '404': { description: Not published or not found } }
  /news:
    get:
      summary: Published news
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: News } }
  /news/{slug}:
    get:
      summary: Published article with gallery
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Article }, '404': { description: Not published or not found } }
  /achievements:
    get:
      summary: Published achievements
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Achievements } }
  /analytics/events:
    post:
      summary: Privacy-conscious first-party event collection, deduplicated by UUID
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
      responses: { '201': { description: Accepted }, '200': { description: Duplicate event }, '400': { description: Invalid event } }
  /auth/login:
    post:
      summary: Sign in and set HttpOnly session and readable CSRF cookies
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }
      responses: { '200': { description: Session and CSRF token }, '401': { description: Invalid credentials } }
  /auth/me:
    get:
      summary: Current user, fresh permissions, and CSRF token
      description: Also returns the configured passwordMinLength so authenticated password forms can match server policy.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Current user }, '401': { description: No active session } }
  /auth/profile:
    get:
      summary: View own profile
      security: [{ sessionCookie: [] }]
