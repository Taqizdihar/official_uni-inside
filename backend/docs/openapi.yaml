  /admin/users/direct-create:
    post:
      summary: Super Administrator directly creates an active CMS member
      description: Requires super_admin, users.invite, CSRF, and a per-actor limit of five attempts per hour. Does not use SMTP. Existing email addresses, including invited and soft-deleted accounts, return USER_EXISTS. A cryptographically generated temporary password is stored only as an Argon2id hash and returned exactly once in a no-store response; audit records contain no credential.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, displayName, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                displayName: { type: string, minLength: 1, maxLength: 150 }
                role: { type: string, enum: [administrator, editor, author, viewer] }
      responses: { '201': { description: '{ data: { user, temporaryPassword } }; Cache-Control no-store' }, '403': { description: 'Role, permission, or CSRF denied' }, '409': { description: USER_EXISTS }, '429': { description: Rate limit exceeded } }
  /admin/users/{id}/reset-password:
    post:
      summary: Super Administrator sets an eligible member's new password
      description: Requires an active super_admin session, users.update, CSRF, and a per-actor limit of five attempts per hour. No current password or SMTP is needed. Rejects self, other super administrators, unaccepted invitations, and deleted/missing accounts. Preserves target role/status. Argon2id password update, target session revocation, outstanding reset-token invalidation, and a secret-free users.password.admin_reset audit event commit atomically. No credential is returned. The member must sign in again; a forced next-login change is not implemented.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 12, maxLength: 1024, description: Uses the configured password minimum and existing weak-password validation }
      responses: { '200': { description: '{ data: { reset: true } }' }, '400': { description: Invalid or weak password }, '401': { description: Authentication required }, '403': { description: 'CSRF, role, permission, self, or target policy denied' }, '404': { description: User not found }, '429': { description: Rate limit exceeded } }
