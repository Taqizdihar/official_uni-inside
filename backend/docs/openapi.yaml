openapi: 3.1.0
info:
  title: Uni-Inside CMS API
  version: 1.0.0
  description: Backend-only Phase 1. Content changes are reflected by the future CMS; the current website still uses static content.
servers:
  - url: http://localhost:4000/api/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: uniinside_session
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token returned by login or current-session lookup; must also match the CSRF cookie.
      schema: { type: string }
    Resource:
      name: resource
      in: path
      required: true
      description: An explicitly configured CMS resource; fixed resources support only GET and PATCH.
      schema:
        type: string
        enum: [social-links, partners, team-members, product-categories, products, product-images, product-features, product-color-options, product-variants, product-purchase-links, service-categories, services, service-list-items, service-process-steps, service-images, projects, project-images, news-categories, news, news-images, achievements, contact-chat-messages, site-settings, page-settings, homepage-sections, hero-settings, hero-trust-signals, hero-workspaces, hero-hotspots, about-settings, about-workspaces, about-principles, team-section-settings, achievement-section-settings, contact-section-settings]
    Key:
      name: key
      in: path
      required: true
      schema: { type: string }
  schemas:
    HeroEditInput:
      type: object
      additionalProperties: false
      required: [headingLine2, descriptionLine1, descriptionLine2, trustSignals, workspaces, callouts]
      description: 'One fixed Hero form. headingLine3 is accepted only when HERO_THREE_LINE_ENABLED, the column exists, and the reviewed Ideas/third-line backfill is present. Character limits are Unicode code points; unchanged legacy text may exceed the new visual limit.'
      properties:
        headingLine2: { type: string, maxLength: 18 }
        headingLine3: { type: string, maxLength: 18 }
        descriptionLine1: { type: string, maxLength: 50 }
        descriptionLine2: { type: [string, 'null'], maxLength: 50 }
        trustSignals:
          type: array
          minItems: 3
          maxItems: 3
          description: 'Slots 1, 2, 3 in that order.'
          items:
            type: object
            additionalProperties: false
            required: [slot, numericValue, suffix, label]
            properties:
              slot: { type: integer, minimum: 1, maximum: 3 }
              numericValue: { type: integer, minimum: 0, maximum: 9999999 }
              suffix: { type: [string, 'null'], maxLength: 16 }
              label: { type: string, maxLength: 14 }
        workspaces:
          type: array
          minItems: 2
          maxItems: 2
          description: 'Studio then Craft; each CTA URL is an internal / path or credential-free HTTPS URL.'
          items:
            type: object
            additionalProperties: false
            required: [key, primaryLabel, primaryUrl, secondaryLabel, secondaryUrl]
            properties:
              key: { type: string, enum: [studio, craft] }
              primaryLabel: { type: string, maxLength: 25 }
              primaryUrl: { type: string, maxLength: 1000 }
              secondaryLabel: { type: [string, 'null'], maxLength: 25 }
              secondaryUrl: { type: [string, 'null'], maxLength: 1000 }
        callouts:
          type: array
          minItems: 10
          maxItems: 10
          description: 'The ten predefined hotspot keys, in the editor display order. Only labels can change.'
          items:
            type: object
            additionalProperties: false
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string, maxLength: 30 }
    FooterSettingsInput:
      type: object
      additionalProperties: false
      required: [footer_description, public_email, public_phone, address_text]
      properties:
        footer_description: { type: [string, 'null'], maxLength: 1000 }
        public_email: { type: [string, 'null'], format: email, maxLength: 254 }
        public_phone: { type: [string, 'null'], maxLength: 50, pattern: '^[+0-9().\\s-]+$' }
        address_text: { type: [string, 'null'], maxLength: 500 }
    FooterSocialPlacement:
      type: object
      description: Future contract only. No live Footer placement endpoint or storage exists yet.
      additionalProperties: false
      required: [social_link_id, position]
      properties:
        social_link_id: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 1, maximum: 10 }
    FooterMapsEmbed:
      type: string
      format: uri
      maxLength: 2048
      description: Future contract only. HTTPS official Google Maps Embed URLs; no live storage or save route exists yet.
    ProductCompose:
      type: object
      additionalProperties: false
      required: [action, name]
      properties:
        action: { type: string, enum: [draft, publish] }
        name: { type: string, minLength: 1, maxLength: 190 }
        category_id: { type: [integer, 'null'], minimum: 1 }
        product_type: { type: string, enum: [ready_made, custom, both] }
        description: { type: string, maxLength: 70000 }
        cover_media_id: { type: [integer, 'null'], minimum: 1 }
        gallery_media_ids: { type: array, maxItems: 8, uniqueItems: true, items: { type: integer, minimum: 1 } }
        base_price: { type: [number, 'null'], minimum: 0, maximum: 999999999999 }
        currency_code: { type: string, pattern: '^[A-Z]{3}$', default: IDR }
        availability_label: { type: [string, 'null'], maxLength: 100 }
        price_note: { type: [string, 'null'], maxLength: 255 }
        lead_time_text: { type: [string, 'null'], maxLength: 255 }
        minimum_order_quantity: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }
        features:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [label, value_text]
            properties:
              label: { type: string, minLength: 1, maxLength: 150 }
              value_text: { type: string, minLength: 1, maxLength: 500 }
        variants:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [name, price, stock_quantity, is_active]
            properties:
              name: { type: string, minLength: 1, maxLength: 150 }
              price: { type: number, minimum: 0, maximum: 999999999999, description: 'Final price; stored as an adjustment relative to base_price' }
              stock_quantity: { type: [integer, 'null'], minimum: 0, maximum: 2147483647 }
              is_active: { type: boolean }
              media_id: { type: [integer, 'null'], minimum: 1, description: 'Only accepted when PRODUCT_VARIANT_MEDIA_ENABLED=true and the required schema is present; otherwise non-null is rejected' }
        platforms:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [platform]
            properties:
              platform: { type: string, enum: [shopee, tokopedia, tiktok, shopify, whatsapp] }
              url: { type: string, maxLength: 1000, description: 'Required HTTP(S) product URL for the four marketplaces; forbidden for WhatsApp' }
              social_link_id: { type: integer, minimum: 1, description: 'Required for WhatsApp only when Social Media V2 is enabled and ready; forbidden otherwise' }
    SocialAccountInput:
      type: object
      additionalProperties: false
      required: [platform_code, label_suffix, url]
      properties:
        platform_code: { type: string, enum: [instagram, whatsapp, youtube, linkedin, tiktok, facebook, x, github, pinterest, threads, discord, telegram] }
        label_suffix: { type: string, minLength: 1, maxLength: 100, description: 'Combined with the immutable platform prefix and " - "; full label max 100 characters' }
        description: { type: [string, 'null'], maxLength: 1000 }
        url: { type: string, format: uri, maxLength: 1000, description: 'Direct HTTPS account URL on the selected platform domain' }
        is_active: { type: boolean, default: true }
        sort_order: { type: integer, minimum: 0, maximum: 65535, default: 0 }
    SocialAccountPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label_suffix: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 1000 }
        url: { type: string, format: uri, maxLength: 1000 }
        is_active: { type: boolean }
        sort_order: { type: integer, minimum: 0, maximum: 65535 }
    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta: { type: object }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: {} }
            requestId: { type: string }
    Login:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 1024 }
    Event:
      type: object
      additionalProperties: false
      required: [eventUuid, eventName]
      properties:
        eventUuid: { type: string, format: uuid }
        eventName: { type: string, enum: [page_view, product_view, product_purchase_link_click, service_view, news_view, cta_click] }
        pagePath: { type: string, maxLength: 500 }
        entityType: { type: string, enum: [product, service, news] }
        entityId: { type: integer, minimum: 1 }
        linkDestination: { type: string, format: uri }
        referrerHost: { type: string, maxLength: 255 }
    ServiceCreateInput:
      type: object
      additionalProperties: false
      required: [name, category_id, description, cover_media_id, gallery_media_ids, pricing_type, starting_price, currency_code, price_note, estimated_duration, items, process_steps, primary_cta_label, primary_cta_url, status]
      properties:
        name: { type: string, maxLength: 190 }
        category_id: { type: [integer, 'null'] }
        description: { type: string, maxLength: 100000, description: Restricted rich text HTML }
        cover_media_id: { type: [integer, 'null'] }
        gallery_media_ids: { type: array, maxItems: 8, items: { type: integer } }
        pricing_type: { type: string, enum: [contact, fixed, starting_from, range] }
        starting_price: { type: [number, 'null'], minimum: 0 }
        currency_code: { type: string, enum: [IDR, USD, SGD, EUR, AUD, MYR] }
        price_note: { type: string, maxLength: 255 }
        estimated_duration: { type: string, maxLength: 255 }
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [item_type, label]
            properties:
              item_type: { type: string, enum: [deliverable, included, requirement, not_included] }
              label: { type: string, maxLength: 500 }
        process_steps:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [title, description]
            properties:
              title: { type: string, maxLength: 150 }
              description: { type: string, maxLength: 1000 }
        primary_cta_label: { type: string, maxLength: 100 }
        primary_cta_url: { type: string, maxLength: 1000 }
        status: { type: string, enum: [draft, published] }
    NewsCreateInput:
      type: object
      additionalProperties: false
      required: [action, title, content_type, category_id, excerpt, body, cover_media_id, gallery_media_ids, author, reading_time_minutes]
      properties:
        action: { type: string, enum: [draft, publish] }
        title: { type: string, maxLength: 255 }
        content_type: { type: string, enum: [news, article, update, event] }
        category_id: { type: [integer, 'null'] }
        excerpt: { type: string, maxLength: 1000 }
        body: { type: string, maxLength: 80000, description: Restricted editorial HTML }
        cover_media_id: { type: [integer, 'null'] }
        gallery_media_ids: { type: array, maxItems: 100, items: { type: integer, minimum: 1 } }
        author:
          oneOf:
            - { type: 'null' }
            - { type: object, additionalProperties: false, required: [source, id], properties: { source: { type: string, enum: [user, team] }, id: { type: integer, minimum: 1 } } }
        reading_time_minutes: { type: [integer, 'null'], minimum: 1, maximum: 999, description: 'Null calculates from readable body text at 200 words per minute' }
    ContentInput:
      type: object
      minProperties: 1
      description: Resource-specific, strict writable fields. Unknown fields are rejected. See backend/src/schemas/resources.ts for each explicit Zod schema; status transitions also run publish validation.
paths:
  /health:
    get:
      summary: Process liveness without database access
      responses: { '200': { description: Live, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } } }
  /ready:
    get:
      summary: Database and schema readiness
      responses:
        '200': { description: Ready }
        '503': { description: Database or migration unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /site:
    get:
      summary: Public site settings, social links, and page settings
      responses: { '200': { description: Published settings } }
  /homepage:
    get:
      summary: Bounded public homepage aggregate
      responses: { '200': { description: Homepage data } }
  /team-members:
    get:
      summary: Published team members
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Team members } }
  /partners:
    get:
      summary: Published partners
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Partners } }
  /products:
    get:
      summary: Published products
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Products } }
  /products/{slug}:
    get:
      summary: Published product with images and child records
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Product }, '404': { description: Not published or not found } }
  /services:
    get:
      summary: Published services
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Services } }
  /services/{slug}:
    get:
      summary: Published service with images, items, and process steps
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Service }, '404': { description: Not published or not found } }
  /projects:
    get:
      summary: Published projects
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Projects } }
  /projects/{slug}:
    get:
      summary: Published project with related services, images and people
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Project }, '404': { description: Not published or not found } }
  /news:
    get:
      summary: Published news
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: News } }
  /news/{slug}:
    get:
      summary: Published article with gallery
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Article }, '404': { description: Not published or not found } }
  /achievements:
    get:
      summary: Published achievements
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Achievements } }
  /analytics/events:
    post:
      summary: Privacy-conscious first-party event collection, deduplicated by UUID
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
      responses: { '201': { description: Accepted }, '200': { description: Duplicate event }, '400': { description: Invalid event } }
  /auth/login:
    post:
      summary: Sign in and set HttpOnly session and readable CSRF cookies
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }
      responses: { '200': { description: Session and CSRF token }, '401': { description: Invalid credentials } }
  /auth/me:
    get:
      summary: Current user, fresh permissions, and CSRF token
      description: Also returns the configured passwordMinLength so authenticated password forms can match server policy.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Current user }, '401': { description: No active session } }
  /auth/profile:
    get:
      summary: View own profile
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Profile } }
    patch:
      summary: Update own display name, avatar, title, and biography
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Profile updated } }
  /auth/logout:
    post:
      summary: Revoke current session
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Logged out } }
  /auth/logout-all:
    post:
      summary: Revoke all user sessions
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Logged out everywhere } }
  /auth/password-change:
    post:
      summary: Change password, revoke old sessions, and set new session
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string } } } } } }
      responses: { '200': { description: Password changed } }
  /auth/invitations/accept:
    post:
      summary: Accept an invitation and set a password
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: Invitation accepted } }
  /auth/password-reset/request:
    post:
      summary: Request a password reset with generic account response
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
      responses: { '200': { description: Generic response } }
  /auth/password-reset/complete:
    post:
      summary: Complete reset and revoke prior sessions
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: Password reset } }
  /admin/dashboard:
    get:
      summary: Content, engagement, and recent audit summary
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Dashboard } }
  /admin/analytics:
    get:
      summary: Rolled-up analytics
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Metrics } }
  /admin/audit:
    get:
      summary: Paginated safe Activity History for all five authenticated CMS roles
      description: Newest first. Returns actor_name and target_name where a user record exists, plus technical action/entity codes for client-side Indonesian labels. Raw snapshots, IP hashes, and user agents are omitted. The established roles may read this safe list without audit.view; other audit-related endpoints retain their own authorization.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Audit entries with nullable actor_name and target_name }, '401': { description: Authentication required }, '403': { description: CMS role not allowed } }
  /admin/users:
    get:
      summary: List CMS users
      description: Requires super_admin or administrator role and users.view permission.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Users }, '403': { description: Role or permission denied } }
  /admin/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }]
    get:
      summary: View CMS user
      description: Requires super_admin or administrator role and users.view permission.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: User }, '403': { description: Role or permission denied } }
    patch:
      summary: Update role or status, preserving last active super administrator
      description: Requires super_admin or administrator role, users.update permission, and CSRF. A super administrator cannot change their own role/status here. Administrators cannot modify super administrators or assign that role, even if granted roles.manage.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: User updated }, '403': { description: FORBIDDEN or SELF_ADMIN_CHANGE_FORBIDDEN }, '409': { description: LAST_SUPER_ADMIN } }
  /admin/users/direct-create:
    post:
      summary: Super Administrator directly creates an active CMS member
      description: Requires super_admin, users.invite, CSRF, and a per-actor limit of five attempts per hour. Does not use SMTP. Existing email addresses, including invited and soft-deleted accounts, return USER_EXISTS. A cryptographically generated temporary password is stored only as an Argon2id hash and returned exactly once in a no-store response; audit records contain no credential.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, displayName, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                displayName: { type: string, minLength: 1, maxLength: 150 }
                role: { type: string, enum: [administrator, editor, author, viewer] }
      responses: { '201': { description: '{ data: { user, temporaryPassword } }; Cache-Control no-store' }, '403': { description: 'Role, permission, or CSRF denied' }, '409': { description: USER_EXISTS }, '429': { description: Rate limit exceeded } }
  /admin/users/{id}/reset-password:
    post:
      summary: Super Administrator sets an eligible member's new password
      description: Requires an active super_admin session, users.update, CSRF, and a per-actor limit of five attempts per hour. No current password or SMTP is needed. Rejects self, other super administrators, unaccepted invitations, and deleted/missing accounts. Preserves target role/status. Argon2id password update, target session revocation, outstanding reset-token invalidation, and a secret-free users.password.admin_reset audit event commit atomically. No credential is returned. The member must sign in again; a forced next-login change is not implemented.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 12, maxLength: 1024, description: Uses the configured password minimum and existing weak-password validation }
      responses: { '200': { description: '{ data: { reset: true } }' }, '400': { description: Invalid or weak password }, '401': { description: Authentication required }, '403': { description: 'CSRF, role, permission, self, or target policy denied' }, '404': { description: User not found }, '429': { description: Rate limit exceeded } }
  /admin/invitations:
    get:
      summary: List invitations
      description: Requires super_admin or administrator role and users.view permission.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Invitations } }
    post:
      summary: Invite a user
      description: Requires super_admin or administrator role, users.invite, and CSRF. Production without SMTP returns 503 instead of claiming email delivery.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '201': { description: Invitation created } }
  /admin/invitations/{id}/resend:
    post:
      summary: Revoke old token and resend pending invitation
      description: Requires super_admin or administrator role, users.invite, and CSRF. Production without SMTP returns 503.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Resent } }
  /admin/invitations/{id}/revoke:
    post:
      summary: Revoke pending invitation
      description: Requires super_admin or administrator role, users.invite, and CSRF.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Revoked } }
  /admin/roles:
    get:
      summary: List roles
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Roles } }
  /admin/permissions:
    get:
      summary: List permissions
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Permissions } }
  /admin/roles/{id}/permissions:
    get:
      summary: Current permission IDs for a role
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Role permissions } }
    put:
      summary: Replace a role's permissions; super administrator is immutable
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Permissions assigned } }
  /admin/media:
    get:
      summary: Browse image library
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: folder, in: query, schema: { type: string } }
        - { name: scope, in: query, description: Backend-managed folder scope, schema: { type: string, enum: [site, users, team, partners, products, services, projects, news, achievements] } }
        - { name: group, in: query, description: Canonical CMS section; choose instead of folder or scope, schema: { type: string, enum: [postingan, utama, lanjutan, pengaturan, administrasi, lainnya] } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, bytes_size, original_filename], default: created_at } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses: { '200': { description: 'Media with page, limit, total, and totalPages metadata' } }
  /admin/media/folders:
    get:
      summary: List active physical Cloudinary folders for authorized media users
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Distinct stored folder paths } }
  /admin/media/sign-upload:
    post:
      summary: Signed Cloudinary image upload parameters for a CMS Bagian
      description: A Bagian (postingan, utama, lanjutan, pengaturan, administrasi) is required. Optional context must belong to that Bagian; central uploads use a generic Bagian folder. The server generates a unique lowercase filename-based public ID and an actor-bound short-lived upload grant. No saved content slug is needed.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [section, filename]
              properties:
                section: { type: string, enum: [postingan, utama, lanjutan, pengaturan, administrasi] }
                context: { type: string, enum: [site, users, team, partners, achievements, products, services, projects, news] }
                filename: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: 'Signed payload with uploadUrl, apiKey, signature, asset_folder, public_id_prefix, public_id, overwrite=false, timestamp, allowed_formats, and uploadGrant'
        '503': { description: Cloudinary unavailable }
  /admin/media/finalize:
    post:
      summary: Verify Cloudinary image and record metadata
      description: Requires the original section, optional context, uploadGrant, and Cloudinary publicId. The grant binds the authenticated actor and public ID; Cloudinary metadata must match the resolved destination.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [section, uploadGrant, publicId]
              properties:
                section: { type: string, enum: [postingan, utama, lanjutan, pengaturan, administrasi] }
                context: { type: string, enum: [site, users, team, partners, achievements, products, services, projects, news] }
                uploadGrant: { type: string }
                publicId: { type: string, maxLength: 255 }
                altText: { type: [string, 'null'], maxLength: 255 }
                caption: { type: [string, 'null'], maxLength: 500 }
      responses: { '201': { description: Image recorded } }
  /admin/media/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      summary: Read an image record for the media picker
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Image metadata }, '404': { description: Image not found } }
    patch:
      summary: Update image alt text and caption
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Updated } }
    delete:
      summary: Delete an unreferenced image from Cloudinary, then soft-delete its CMS record
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Cloudinary confirmed deleted or not_found and CMS record was soft-deleted }, '409': { description: Image is referenced }, '502': { description: Cloudinary deletion failed }, '503': { description: CMS could not save after Cloudinary deletion } }
  /admin/media/{id}/rename:
    patch:
      summary: Rename an unreferenced image in Cloudinary and update its CMS record
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties: { name: { type: string, minLength: 1, maxLength: 120 } }
      responses: { '200': { description: Renamed image record }, '409': { description: Image is referenced or name exists }, '502': { description: Cloudinary rename failed } }
  /admin/media/{id}/move:
    patch:
      summary: Move an unreferenced image to a Bagian
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section]
              additionalProperties: false
              properties: { section: { type: string, enum: [postingan, utama, lanjutan, pengaturan, administrasi] } }
      responses: { '200': { description: Moved image record }, '409': { description: Image is referenced }, '502': { description: Cloudinary move failed } }
  /admin/projects/{key}/services:
    get:
      summary: Current related services with IDs and labels
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Key' }]
      responses: { '200': { description: Related services } }
    put:
      summary: Transactionally replace project service links
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Key' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Relations updated } }
  /admin/projects/{key}/team-members:
    get:
      summary: Current related team members with IDs and labels
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Key' }]
      responses: { '200': { description: Related team members } }
    put:
      summary: Transactionally replace project team links
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Key' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Relations updated } }
  /admin/revisions/{resource}/{key}:
    get:
      summary: List a content item's revisions
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/Key' }]
      responses: { '200': { description: Revisions } }
  /admin/revisions/{resource}/{key}/restore/{id}:
    post:
      summary: Restore approved writable values as a new audited revision
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/Key' }, { name: id, in: path, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Restored } }
  /admin/services/create-complete:
    post:
      summary: Atomically create a service with ordered images, information items, and process steps
      description: Requires services.create; publishing also requires services.update and services.publish. The server derives a unique slug and plain-text summary from the sanitized description.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceCreateInput' } } } }
      responses: { '201': { description: Service and all child records created }, '400': { description: Validation error }, '403': { description: Missing permission }, '409': { description: Slug conflict } }
  /admin/news/author-options:
    get:
      summary: Eligible author display names for article creators
      description: Requires news.create; returns only source, ID, and public display name.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: source, in: query, required: true, schema: { type: string, enum: [user, team] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses: { '200': { description: Paginated author names }, '403': { description: Missing news.create permission } }
  /admin/news/create-complete:
    post:
      summary: Atomically create an article and its ordered images
      description: Requires news.create; publishing also requires news.update and news.publish. Reading time is calculated only when no manual value is provided.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewsCreateInput' } } } }
      responses: { '201': { description: Persisted article and gallery }, '400': { description: Invalid input or incomplete publication }, '403': { description: Missing permission } }
  /admin/footer:
    get:
      summary: Read the four persistent Footer settings and independent pending capabilities
      description: Requires settings.view. Footer social placement and Maps embed capabilities remain disabled; this route never queries pending V2 tables.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 'data.settings contains only the four Footer fields; data.capabilities reports base settings available and advanced controls pending' }
        '403': { description: Missing settings.view permission }
    patch:
      summary: Save only the four existing Footer settings fields
      description: Requires settings.update and CSRF. Unknown fields are rejected. Does not persist social placement IDs or a Maps URL. Existing audit and revision records are written.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FooterSettingsInput' } } } }
      responses:
        '200': { description: The four persisted Footer settings and capability state }
        '400': { description: Invalid or unknown field }
        '403': { description: Missing permission or CSRF token }
  /admin/homepage/hero:
    get:
      summary: Read the unified Hero editor and third-heading capability
      description: Requires homepage.view. When the third-line gate is off, the missing column is never queried and headingLine3 is absent from data.edit.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: 'data.edit, data.headingLine3Enabled, and read-only data.calloutPrefixes' }, '403': { description: Missing homepage.view permission } }
    patch:
      summary: Atomically save the supported Hero fields
      description: Requires homepage.update and CSRF. Unknown or restricted fields and changed fixed identities are rejected. Legacy generic Hero writes and revision restores return 409. Audit and revision records share the transaction.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HeroEditInput' } } } }
      responses: { '200': { description: Actual persisted Hero values and capability state }, '400': { description: Invalid content or unavailable third heading line }, '403': { description: Missing permission or CSRF token }, '503': { description: Fixed Hero data incomplete } }
  /admin/social-media/capabilities:
    get:
      summary: Check disabled-by-default Social Media V2 and product variant-media readiness
      description: Requires a signed-in CMS session. With both flags disabled, this endpoint does not inspect the pending tables or columns. Readiness checks required columns and foreign keys only when a flag is enabled; Social Media V2 also requires all supported platform rows and no unmapped legacy account.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 'data.socialMediaV2 and data.productVariantMedia each contain enabled and reason (FEATURE_DISABLED, DATABASE_MIGRATION_PENDING, or null)' }
        '401': { description: Sign-in required }
  /admin/social-media/platforms:
    get:
      summary: Read the curated platform registry after Social Media V2 activation
      description: Requires settings.view and an enabled, schema-ready Social Media V2 capability.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: 'Ordered platform IDs, stable codes, names, icon keys, and order' }, '403': { description: Missing settings.view }, '503': { description: FEATURE_UNAVAILABLE } }
  /admin/social-media/accounts:
    get:
      summary: List Social Media accounts grouped by canonical platform ID
      description: Requires settings.view and Social Media V2 readiness. Inactive accounts remain visible.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: 'Ordered accounts including label, description, URL, active status, sort order, and canonical platform' }, '403': { description: Missing settings.view }, '503': { description: FEATURE_UNAVAILABLE } }
    post:
      summary: Create one account on a curated platform
      description: Requires settings.update and CSRF. The parent platform row is locked before counting; the sixth account on a platform is rejected with ACCOUNT_LIMIT. The server creates an opaque, unique legacy platform_code and audits the mutation.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialAccountInput' } } } }
      responses: { '201': { description: Created account }, '400': { description: 'Invalid label, URL, or platform' }, '403': { description: Missing permission or CSRF }, '409': { description: ACCOUNT_LIMIT or ALREADY_EXISTS }, '503': { description: FEATURE_UNAVAILABLE } }
  /admin/social-media/accounts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      summary: Read one Social Media account
      description: Requires settings.view and Social Media V2 readiness.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Account }, '403': { description: Missing permission }, '404': { description: Account not found }, '503': { description: FEATURE_UNAVAILABLE } }
    patch:
      summary: Change an account without reassigning its platform
      description: Requires settings.update and CSRF. Referenced accounts cannot be deactivated. Published Product links follow the account's updated URL; the purchase link retains its last-saved URL for legacy compatibility.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialAccountPatch' } } } }
      responses: { '200': { description: Updated account }, '400': { description: Invalid input }, '403': { description: Missing permission or CSRF }, '409': { description: ACCOUNT_REFERENCED }, '503': { description: FEATURE_UNAVAILABLE } }
    delete:
      summary: Delete an unreferenced Social Media account
      description: Requires settings.update and CSRF. Any Product purchase-link reference blocks deletion; no Product rows cascade.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Removed account }, '403': { description: Missing permission or CSRF }, '409': { description: ACCOUNT_REFERENCED }, '503': { description: FEATURE_UNAVAILABLE } }
  /admin/social-media/whatsapp-options:
    get:
      summary: Eligible WhatsApp account options for Product creation
      description: Requires products.create or settings.view and Social Media V2 readiness. Returns only active WhatsApp account ID, label, and URL; no Social Media editing permission is granted.
      security: [{ sessionCookie: [] }]
      responses: { '200': { description: Up to five eligible account options }, '403': { description: Missing permission }, '503': { description: FEATURE_UNAVAILABLE } }
  /admin/products/compose:
    post:
      summary: Atomically create a product and its ordered child records
      description: 'Requires products.create; publish also requires products.update, products.publish, and publication completeness. WhatsApp uses the legacy global URL while Social Media V2 is disabled; when enabled, social_link_id is required and validated against an active saved WhatsApp account. Variant media_id is accepted only when its separate capability is enabled and ready. Both flags default to false.'
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCompose' }
      responses:
        '201': { description: 'Persisted product; status confirms draft or published' }
        '400': { description: 'Validation, unsupported variant photo, invalid selected WhatsApp account, missing global WhatsApp, or incomplete publication; no data is committed' }
        '403': { description: 'Missing permission or invalid CSRF token' }
  /admin/{resource}:
    get:
      summary: Paginated CMS records; requires resource view permission
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Resource' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, scheduled, published, archived] } }
        - { name: categoryId, in: query, schema: { type: integer } }
        - { name: productType, in: query, description: 'Products only', schema: { type: string, enum: [ready_made, custom, both] } }
        - { name: contentType, in: query, description: 'News only', schema: { type: string, enum: [news, article, update, event] } }
        - { name: parentId, in: query, schema: { type: integer } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
      responses: { '200': { description: 'Filtered records with page, limit, total, and totalPages metadata' } }
    post:
      summary: Create a dynamic resource draft; fixed resources return 405
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentInput' } } } }
      responses: { '201': { description: Created }, '405': { description: Fixed content } }
  /admin/{resource}/{key}:
    get:
      summary: View a CMS record
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/Key' }]
      responses: { '200': { description: Record } }
    patch:
      summary: Update approved values; generic Hero writes return 409 and use the unified Hero route
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/Key' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContentInput' } } } }
      responses: { '200': { description: Updated }, '400': { description: Invalid publish state } }
    delete:
      summary: Remove dynamic content; fixed content returns 405
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/Resource' }, { $ref: '#/components/parameters/Key' }, { $ref: '#/components/parameters/Csrf' }]
      responses: { '200': { description: Removed }, '405': { description: Fixed content } }
